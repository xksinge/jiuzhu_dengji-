name: 打包救助工具
on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: 打包exe
        run: |
          pyinstaller -F -w 救助信息登记工具.py --hidden-import openpyxl --collect-data openpyxl

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: 救助工具-Windows
          path: dist/*.exe
